<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FP2級ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8F0;
    --surface:#FFFFFF;
    --surface-2:#FFEEE0;
    --text:#4A3B36;
    --text-muted:#A3897C;
    --border:#F5DFCB;
    --accent:#FFC940;
    --accent-strong:#C98A00;
    --accent-soft:#FFF3D0;
    --accent-contrast:#4A3B36;
    --good:#2FBE93;
    --good-soft:#DFF7EE;
    --bad:#FF6F61;
    --bad-soft:#FFE7E3;
    --warn:#FFAB3D;
    --warn-soft:#FFF1DA;
    --shadow:rgba(230,150,120,0.18);
    --cat-a:#6C8EF5;
    --cat-b:#FF9F5A;
    --cat-c:#2EBFC4;
    --cat-d:#B27DE8;
    --cat-e:#6FC15E;
    --cat-f:#FF6FA0;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    --font-display:'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    --font-body:'M PLUS Rounded 1c','Hiragino Sans','Yu Gothic',sans-serif;
    --font-mono:'M PLUS Rounded 1c',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#2B2130;
      --surface:#3B2C3E;
      --surface-2:#463649;
      --text:#FDEFEA;
      --text-muted:#CAAEC0;
      --border:#503F53;
      --accent:#FFD666;
      --accent-strong:#FFE8A3;
      --accent-soft:#4A3D1F;
      --accent-contrast:#2B2130;
      --good:#6EE7B7;
      --good-soft:#1F3D34;
      --bad:#FF9B8F;
      --bad-soft:#40252A;
      --warn:#FFCB6B;
      --warn-soft:#453317;
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#2B2130;
    --surface:#3B2C3E;
    --surface-2:#463649;
    --text:#FDEFEA;
    --text-muted:#CAAEC0;
    --border:#503F53;
    --accent:#FFD666;
    --accent-strong:#FFE8A3;
    --accent-soft:#4A3D1F;
    --accent-contrast:#2B2130;
    --good:#6EE7B7;
    --good-soft:#1F3D34;
    --bad:#FF9B8F;
    --bad-soft:#40252A;
    --warn:#FFCB6B;
    --warn-soft:#453317;
    --shadow:rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---------- header ---------- */
  header.topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
  }
  .brand .mark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    letter-spacing:.02em;
    color:var(--accent-strong);
  }
  .brand .sub{
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:.06em;
  }
  .streak-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 12px;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
  }
  .streak-pill b{color:var(--accent-strong); font-weight:700;}

  /* ---------- main scroll area ---------- */
  main{
    flex:1;
    padding:16px 16px 96px;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:var(--font-display);
    text-wrap:balance;
    margin:0 0 6px;
    color:var(--text);
  }
  h1{font-size:22px; font-weight:700;}
  h2{font-size:17px; font-weight:700;}
  p{line-height:1.7; color:var(--text-muted); margin:0 0 12px;}
  .section-title{
    display:flex; align-items:center; justify-content:space-between;
    margin:28px 0 12px;
  }
  .section-title h2{margin:0;}
  .section-title .more{font-size:12px; color:var(--accent); cursor:pointer; white-space:nowrap;}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px;
    box-shadow:0 2px 10px var(--shadow);
  }
  .card + .card{margin-top:12px;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; align-items:center; gap:12px;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}

  /* ---------- home: hero accuracy ---------- */
  .hero-card{
    background:linear-gradient(155deg, var(--accent-strong), var(--accent));
    color:var(--accent-contrast);
    border:none;
    position:relative;
    overflow:hidden;
  }
  .hero-card::after{
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px; height:160px; border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .hero-grid{
    display:flex; align-items:center; gap:20px; position:relative; z-index:1;
  }
  .ring-wrap{flex:0 0 auto;}
  .ring-num{
    font-family:var(--font-mono); font-weight:700; font-size:22px;
  }
  .hero-stats{flex:1; min-width:0;}
  .hero-stats .label{font-size:12px; opacity:.8; margin-bottom:2px;}
  .hero-stats .big{font-family:var(--font-mono); font-size:30px; font-weight:700; line-height:1.1;}
  .hero-stats .sub{font-size:12px; opacity:.85; margin-top:6px;}

  /* ---------- category bars ---------- */
  .cat-row{
    display:flex; align-items:center; gap:10px; padding:9px 0;
  }
  .cat-chip{
    flex:0 0 auto;
    font-size:11px; font-weight:700; color:#fff;
    border-radius:7px; padding:3px 8px;
    letter-spacing:.02em; white-space:nowrap;
  }
  .cat-a{background:var(--cat-a);} .cat-b{background:var(--cat-b);}
  .cat-c{background:var(--cat-c);} .cat-d{background:var(--cat-d);}
  .cat-e{background:var(--cat-e);} .cat-f{background:var(--cat-f);}
  .cat-track{
    flex:1; height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden;
  }
  .cat-fill{height:100%; border-radius:5px; transition:width .5s ease;}
  .cat-pct{
    flex:0 0 auto; font-family:var(--font-mono); font-size:12px; width:38px; text-align:right;
    color:var(--text-muted); font-variant-numeric:tabular-nums;
  }
  .cat-meta{font-size:11px; color:var(--text-muted); flex:0 0 auto; width:56px; text-align:right; font-variant-numeric:tabular-nums;}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    padding:13px 18px;
    font-size:14px; font-weight:700;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn.primary{
    background:var(--accent); border-color:var(--accent); color:var(--accent-contrast);
  }
  .btn.block{width:100%;}
  .btn.ghost{background:transparent;}
  .btn.sm{padding:8px 12px; font-size:12px; border-radius:10px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed;}

  /* ---------- chips / toggles (filter UI) ---------- */
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-muted);
    border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600;
    cursor:pointer; user-select:none;
    transition:all .15s ease;
  }
  .chip[data-on="true"]{
    background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);
  }
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  /* ---------- quiz question card ---------- */
  .q-meta{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .q-progress{font-family:var(--font-mono); font-size:12px; color:var(--text-muted);}
  .exam-tag{font-size:11px; color:var(--text-muted); border:1px solid var(--border); border-radius:6px; padding:2px 7px;}
  .q-text{font-size:15.5px; line-height:1.85; white-space:pre-wrap; margin-bottom:16px;}
  .q-text.data-block{
    font-family:var(--font-mono); font-size:12.5px; background:var(--surface-2);
    border-radius:var(--radius-sm); padding:12px; white-space:pre; overflow-x:auto; line-height:1.6;
  }

  .choice{
    display:flex; align-items:flex-start; gap:10px; width:100%;
    text-align:left; padding:13px 14px; margin-bottom:9px;
    border-radius:var(--radius-md); border:1.5px solid var(--border); background:var(--surface);
    font-size:14.5px; line-height:1.6; color:var(--text); cursor:pointer;
  }
  .choice .num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    background:var(--surface-2); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:12px; font-weight:700;
  }
  .choice.correct{border-color:var(--good); background:var(--good-soft);}
  .choice.correct .num{background:var(--good); color:#fff;}
  .choice.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .choice.wrong .num{background:var(--bad); color:#fff;}
  .choice[disabled]{cursor:default;}

  .ox-item{
    border:1.5px solid var(--border); border-radius:var(--radius-md);
    padding:12px 14px; margin-bottom:10px; background:var(--surface);
  }
  .ox-item .ox-text{font-size:14px; line-height:1.7; margin-bottom:10px;}
  .ox-toggle{display:flex; gap:8px;}
  .ox-btn{
    flex:1; padding:9px; border-radius:10px; border:1.5px solid var(--border);
    background:var(--surface-2); font-weight:700; font-size:15px; cursor:pointer; color:var(--text-muted);
  }
  .ox-btn[data-active="true"].true{border-color:var(--good); background:var(--good-soft); color:var(--good);}
  .ox-btn[data-active="true"].false{border-color:var(--bad); background:var(--bad-soft); color:var(--bad);}
  .ox-item.graded{opacity:1;}
  .ox-result-icon{font-weight:900; margin-right:6px;}
  .ox-item.g-correct{border-color:var(--good);}
  .ox-item.g-wrong{border-color:var(--bad);}

  .verdict-banner{
    display:flex; align-items:center; gap:10px;
    border-radius:var(--radius-md); padding:13px 15px; margin-bottom:14px;
    font-weight:700; font-size:15px;
  }
  .verdict-banner.good{background:var(--good-soft); color:var(--good);}
  .verdict-banner.bad{background:var(--bad-soft); color:var(--bad);}
  .verdict-banner .icon{font-size:20px;}

  .explain-box{
    background:var(--surface-2); border-radius:var(--radius-md); padding:14px 15px; margin-top:4px;
  }
  .explain-box .lbl{font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.08em; margin-bottom:6px;}
  .explain-box .body{font-size:14px; line-height:1.8; white-space:pre-wrap; color:var(--text);}

  .answer-blank{
    display:flex; align-items:center; gap:10px; padding:8px 0; font-family:var(--font-mono);
  }
  .answer-blank .lab{font-size:12px; color:var(--text-muted); width:26px;}
  .answer-blank .val{font-size:17px; font-weight:700; color:var(--accent-strong);}

  /* ---------- wordbank ---------- */
  .wb-blank{
    border:1.5px solid var(--border); border-radius:var(--radius-md);
    padding:12px 14px; margin-bottom:12px; background:var(--surface);
  }
  .wb-blank-label{font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px;}
  .wb-opts{display:flex; flex-wrap:wrap; gap:8px;}
  .wb-opt{
    border:1.5px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:999px; padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .wb-opt[data-active="true"]{
    background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong);
  }
  .wb-opt[disabled]{cursor:default;}
  .wb-blank.g-correct{border-color:var(--good);}
  .wb-blank.g-wrong{border-color:var(--bad);}

  /* ---------- tab bar ---------- */
  nav.tabbar{
    position:sticky; bottom:0; z-index:30;
    display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tab-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:8px 4px; cursor:pointer;
    color:var(--text-muted); font-size:11px; font-weight:700; border-radius:12px;
  }
  .tab-btn .ic{font-size:19px; line-height:1;}
  .tab-btn[data-active="true"]{color:var(--accent-strong); background:var(--accent-soft);}

  /* ---------- misc ---------- */
  .empty{
    text-align:center; padding:40px 16px; color:var(--text-muted);
  }
  .empty .ic{font-size:34px; margin-bottom:10px;}
  .divider{height:1px; background:var(--border); margin:16px 0;}
  .list-row{
    display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .txt{flex:1; min-width:0;}
  .list-row .txt .t1{font-size:13.5px; line-height:1.5; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .list-row .txt .t2{font-size:11px; color:var(--text-muted); margin-top:3px;}
  .result-dot{flex:0 0 auto; width:10px; height:10px; border-radius:50%;}
  .result-dot.good{background:var(--good);}
  .result-dot.bad{background:var(--bad);}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    background:var(--surface); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    padding:22px 18px calc(22px + env(safe-area-inset-bottom)); max-height:82vh; overflow-y:auto;
  }

  select.native{
    width:100%; padding:11px 12px; border-radius:var(--radius-md); border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:14px; font-family:inherit;
  }
  label.field-label{font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:6px; display:block; letter-spacing:.03em;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- lock screen ---------- */
  .lock-overlay{
    position:fixed; inset:0; z-index:100;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .lock-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:32px 24px; max-width:340px; width:100%; text-align:center;
    box-shadow:0 2px 10px var(--shadow);
  }
  .lock-card .mark{
    font-family:var(--font-display); font-weight:700; font-size:22px;
    color:var(--accent-strong); margin-bottom:10px; display:block;
  }
  .lock-card p{margin:0 0 18px;}
  .lock-input{
    width:100%; padding:13px 14px; border-radius:var(--radius-md); border:1.5px solid var(--border);
    background:var(--surface); color:var(--text); font-size:15px; font-family:inherit;
    margin-bottom:12px; text-align:center;
  }
  .lock-input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .lock-error{display:none; color:var(--bad); font-size:13px; margin:-4px 0 12px;}
</style>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <span class="mark">FP2級ドリル</span>
    <p>合言葉を入力してください</p>
    <form id="lockForm">
      <input type="password" id="lockInput" class="lock-input" placeholder="合言葉" autocomplete="off" autofocus>
      <div class="lock-error" id="lockError">合言葉が違います</div>
      <button type="submit" class="btn primary block">開く</button>
    </form>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark">FP2級ドリル</span>
    </div>
    <div class="streak-pill" id="headerStreak">📅 <b>0</b>日</div>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tab-btn" data-tab="home"><span class="ic">🏠</span>ホーム</button>
    <button class="tab-btn" data-tab="quiz"><span class="ic">✏️</span>演習</button>
    <button class="tab-btn" data-tab="review"><span class="ic">🔍</span>復習</button>
    <button class="tab-btn" data-tab="settings"><span class="ic">⚙️</span>設定</button>
  </nav>
</div>

<script>
/* =========================================================
   FP2級 すきま学習 — data
   ========================================================= */
const CATEGORIES = {
  A: {name:"ライフプランニング", short:"ライフ", cls:"cat-a", color:"var(--cat-a)"},
  B: {name:"リスク管理",       short:"保険",   cls:"cat-b", color:"var(--cat-b)"},
  C: {name:"金融資産運用",     short:"金融",   cls:"cat-c", color:"var(--cat-c)"},
  D: {name:"タックスプランニング", short:"税金", cls:"cat-d", color:"var(--cat-d)"},
  E: {name:"不動産",           short:"不動産", cls:"cat-e", color:"var(--cat-e)"},
  F: {name:"相続・事業承継",   short:"相続",   cls:"cat-f", color:"var(--cat-f)"},
};
const EXAM_META = {
  r7_5_gakka:   {label:"学科 R7.5(2025年5月)", kind:"学科"},
  r7_5_jitsugi: {label:"実技 R7.5(2025年5月)", kind:"実技"},
  r8_5_gakka:   {label:"学科 R8.5(2026年5月)", kind:"学科"},
  r8_5_jitsugi: {label:"実技 R8.5(2026年5月)", kind:"実技"},
  r7_1_gakka:   {label:"学科 R7.1(2025年1月)", kind:"学科"},
  r7_1_jitsugi: {label:"実技 R7.1(2025年1月)", kind:"実技"},
  r6_9_gakka:   {label:"学科 R6.9(2024年9月)", kind:"学科"},
  r6_9_jitsugi: {label:"実技 R6.9(2024年9月)", kind:"実技"},
  r6_5_gakka:   {label:"学科 R6.5(2024年5月)", kind:"学科"},
  r6_5_jitsugi: {label:"実技 R6.5(2024年5月)", kind:"実技"},
};

/*EXAMS_PLACEHOLDER_START*/
const EXAMS = [
{
  "examId": "r7_5_gakka",
  "examLabel": "2025年5月学科試験",
  "questions": [
    {
      "id": "r7_5_gakka_01",
      "number": 1,
      "category": "A",
      "type": "mc4",
      "question": "ファイナンシャル・プランナー（以下、「ＦＰ」という）の顧客に対する行為に関する次の記述のうち、関連法規に照らし、最も不適切なものはどれか。",
      "choices": [
        "社会保険労務士の登録を受けていないＦＰが、年金の相談に来た顧客の求めに応じ、公的年金の裁定請求手続を代行して報酬を受け取った。",
        "生命保険募集人の登録を受けていないＦＰが、ライフプランの相談に来た顧客の求めに応じ、ライフイベントに応じた生命保険の一般的な活用方法を説明した。",
        "金融商品取引業者の登録を受けていないＦＰが、資産運用の相談に来た顧客の求めに応じ、顧客の投資判断材料となる景気動向や企業業績に関する情報を提供した。",
        "税理士の登録を受けていないＦＰが、相続の相談に来た顧客の求めに応じ、顧客の具体的な相続税額の算出のために知り合いの税理士を紹介した。"

const LS_LOG = "fp2_log_v2";

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(LS_PROGRESS)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(LS_PROGRESS, JSON.stringify(p)); }catch(e){}
}
function loadLog(){
  try{ return JSON.parse(localStorage.getItem(LS_LOG)) || []; }catch(e){ return []; }
}
function saveLog(l){
  try{ localStorage.setItem(LS_LOG, JSON.stringify(l.slice(-300))); }catch(e){}
}

let ALL_QUESTIONS = [];
let Q_BY_ID = {};
function buildIndex(){
  ALL_QUESTIONS = [];
  EXAMS.forEach(ex=>{
    ex.questions.forEach(q=>{
      const merged = Object.assign({}, q, {examId:ex.examId, examLabel:ex.examLabel});
      ALL_QUESTIONS.push(merged);
    });
  });
  Q_BY_ID = {};
  ALL_QUESTIONS.forEach(q=>{ Q_BY_ID[q.id]=q; });
}
buildIndex();

function recordResult(qid, correct){
  const p = loadProgress();
  const cur = p[qid] || {a:0,c:0,last:null};
  cur.a += 1;
  if(correct) cur.c += 1;
  cur.last = correct;
  cur.ts = Date.now();
  p[qid] = cur;
  saveProgress(p);
  const log = loadLog();
  const q = Q_BY_ID[qid];
  log.push({id:qid, cat:q?q.category:null, correct:correct, ts:Date.now()});
  saveLog(log);
  updateStreakDisplay();
}

function categoryStats(){
  const p = loadProgress();
  const stats = {};
  Object.keys(CATEGORIES).forEach(c=> stats[c]={a:0,c:0});
  ALL_QUESTIONS.forEach(q=>{
    const rec = p[q.id];
    if(rec && rec.a>0){
      stats[q.category].a += rec.a;
      stats[q.category].c += rec.c;
    }
  });
  return stats;
}

function overallStats(){
  const p = loadProgress();
  let a=0,c=0, attempted=0;
  Object.keys(p).forEach(id=>{
    a += p[id].a; c += p[id].c;
    if(p[id].a>0) attempted++;
  });
  return {a,c,attempted, total:ALL_QUESTIONS.length, pct: a? Math.round(c/a*100):0};
}

function studyDaysStreak(){
  const log = loadLog();
  if(!log.length) return 0;
  const days = new Set(log.map(e=> new Date(e.ts).toDateString()));
  let streak=0;
  let d = new Date();
  while(true){
    const key = d.toDateString();
    if(days.has(key)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function updateStreakDisplay(){
  document.getElementById('headerStreak').innerHTML = '📅 <b>'+studyDaysStreak()+'</b>日';
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildPool(filters){
  let pool = ALL_QUESTIONS.filter(q=>{
    const kindOk = filters.examKind==='all' || EXAM_META[q.examId].kind===filters.examKind;
    const catOk = filters.categories.has(q.category);
    return kindOk && catOk;
  });
  const progress = loadProgress();

  if(filters.mode==='random'){
    pool = shuffle(pool);
  } else if(filters.mode==='wrong'){
    pool = pool.filter(q=>{
      const rec = progress[q.id];
      return rec && rec.last===false;
    });
    pool = shuffle(pool);
  } else if(filters.mode==='smart'){
    const cs = categoryStats();
    const catPct = {};
    Object.keys(CATEGORIES).forEach(c=> catPct[c] = cs[c].a? cs[c].c/cs[c].a : 0.4);
    pool = shuffle(pool).sort((a,b)=>{
      const scoreA = questionPriority(a, progress, catPct);
      const scoreB = questionPriority(b, progress, catPct);
      return scoreB - scoreA;
    });
  } else {
    // sequential
    pool = pool.slice().sort((a,b)=>{
      if(a.examId!==b.examId) return a.examId.localeCompare(b.examId);
      return a.number-b.number;
    });
  }
  return pool;
}

function questionPriority(q, progress, catPct){
  const rec = progress[q.id];
  let score = 0;
  if(!rec || rec.a===0) score += 3;         // unattempted: high priority
  else if(rec.last===false) score += 2.5;   // last time wrong
  else score += 0.3;
  score += (1-catPct[q.category])*2;        // weaker categories bubble up
  score += Math.random()*0.5;               // tie-break jitter
  return score;
}

/* =========================================================
   QUIZ PLAY
   ========================================================= */
function startQuiz(pool){
  if(!pool.length){ alert('対象の問題がありません。条件を変えてください。'); return; }
  quizSession = {pool, idx:0, sessionCorrect:0, sessionTotal:0, graded:false, userState:{}};
  render();
}

function currentQ(){ return quizSession.pool[quizSession.idx]; }

function renderQuizPlay(){
  if(quizSession.idx >= quizSession.pool.length){
    return renderQuizSummary();
  }
  const q = currentQ();
  const meta = CATEGORIES[q.category];
  const examMeta = EXAM_META[q.examId];
  const progressLabel = `${quizSession.idx+1} / ${quizSession.pool.length}`;

  let body = '';
  if(q.type==='mc4') body = renderMC4(q);
  else if(q.type==='ox') body = renderOX(q);
  else if(q.type==='calc') body = renderCalc(q);
  else if(q.type==='wordbank') body = renderWordbank(q);

  return `
    <div class="q-meta">
      <span class="cat-chip ${meta.cls}">${meta.name}</span>
      <span class="exam-tag">${examMeta.label} 問${q.number}</span>
      <span class="q-progress" style="margin-left:auto;">${progressLabel}</span>
    </div>
    <div class="q-text">${escapeHtml(q.question)}</div>
    ${body}
  `;
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---- MC4 ---- */
function renderMC4(q){
  const answered = quizSession.userState.answered;
  const choices = q.choices.map((c,i)=>{
    let cls = '';
    if(answered!==undefined){
      if(i===q.correctIndex) cls='correct';
      else if(i===answered) cls='wrong';
    }
    return `<button class="choice ${cls}" data-idx="${i}" ${answered!==undefined?'disabled':''}>
      <span class="num">${i+1}</span><span>${escapeHtml(c)}</span>
    </button>`;
  }).join('');

  let footer = '';
  if(answered!==undefined){
    const correct = answered===q.correctIndex;
    footer = renderVerdictAndExplain(correct, q.explanation);
  }
  return `<div id="choicesWrap">${choices}</div>${footer}`;
}

/* ---- OX ---- */
function renderOX(q){
  const state = quizSession.userState.ox || {};
  const graded = quizSession.userState.oxGraded;
  const items = q.items.map(it=>{
    const val = state[it.label];
    let itemCls='';
    if(graded){
      const isRight = val===it.correct;
      itemCls = isRight? 'g-correct':'g-wrong';
    }
    return `<div class="ox-item ${itemCls}" data-label="${it.label}">
      <div class="ox-text">${graded? (val===it.correct?'<span class="ox-result-icon" style="color:var(--good)">◯</span>':'<span class="ox-result-icon" style="color:var(--bad)">×</span>') : ''}（${it.label}）${escapeHtml(it.text)}</div>
      <div class="ox-toggle">
        <button class="ox-btn true" data-active="${val===true}" data-label="${it.label}" data-val="true" ${graded?'disabled':''}>○</button>
        <button class="ox-btn false" data-active="${val===false}" data-label="${it.label}" data-val="false" ${graded?'disabled':''}>×</button>
      </div>
      ${graded? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px;">正解: ${it.correct?'◯':'×'}</div>`:''}
    </div>`;
  }).join('');

  const allAnswered = q.items.every(it=> state[it.label]!==undefined);
  let footer = '';
  if(!graded){
    footer = `<button class="btn primary block" id="btnGradeOx" ${allAnswered?'':'disabled'}>採点する</button>`;
  } else {
    const allCorrect = q.items.every(it=> state[it.label]===it.correct);
    footer = renderVerdictAndExplain(allCorrect, q.explanation);
  }
  return `<div id="oxWrap">${items}</div>${footer}`;
}

/* ---- CALC ---- */
function renderCalc(q){
  const revealed = quizSession.userState.revealed;
  if(!revealed){
    return `<button class="btn primary block" id="btnReveal">解答を見る</button>`;
  }
  const blanksHtml = q.blanks.map(b=>{
    return `<div class="answer-blank">${b.label? `<span class="lab">（${b.label}）</span>`:''}<span class="val">${escapeHtml(b.answer)}</span></div>`;
  }).join('');

  let footer = '';
  const selfGrade = quizSession.userState.selfGrade;
  if(selfGrade===undefined){
    footer = `
      <p style="margin:14px 0 8px;font-weight:700;color:var(--text);">自己採点：ご自身の解答は正解でしたか？</p>
      <div class="row" style="gap:10px;">
        <button class="btn block" id="btnSelfCorrect" style="border-color:var(--good);color:var(--good);">◯ 正解した</button>
        <button class="btn block" id="btnSelfWrong" style="border-color:var(--bad);color:var(--bad);">× 間違えた</button>
      </div>
    `;
  } else {
    footer = renderVerdictAndExplain(selfGrade, q.explanation);
  }

  return `
    <div class="card" style="background:var(--surface-2);border:none;box-shadow:none;">
      <div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.08em;margin-bottom:8px;">正解</div>
      ${blanksHtml}
    </div>
    ${footer}
  `;
}

/* ---- WORDBANK ---- */
function renderWordbank(q){
  const state = quizSession.userState.wb || {};
  const graded = quizSession.userState.wbGraded;
  const blanksHtml = q.blanks.map(bl=>{
    const val = state[bl.label];
    let blockCls = '';
    if(graded){
      const isRight = val===bl.answer;
      blockCls = isRight? 'g-correct':'g-wrong';
    }
    const optsHtml = q.bank.map(b=>{
      const active = val===b.num;
      return `<button class="wb-opt" data-active="${active}" data-label="${bl.label}" data-num="${b.num}" ${graded?'disabled':''}>${b.num}. ${escapeHtml(b.text)}</button>`;
    }).join('');
    const correctBankItem = q.bank.find(b=> b.num===bl.answer);
    return `<div class="wb-blank ${blockCls}" data-label="${bl.label}">
      <div class="wb-blank-label">${graded? (val===bl.answer?'<span class="ox-result-icon" style="color:var(--good)">◯</span>':'<span class="ox-result-icon" style="color:var(--bad)">×</span>') : ''}（${bl.label}）</div>
      <div class="wb-opts">${optsHtml}</div>
      ${graded? `<div style="font-size:12px;color:var(--text-muted);margin-top:8px;">正解: ${bl.answer}. ${escapeHtml(correctBankItem? correctBankItem.text : '')}</div>`:''}
    </div>`;
  }).join('');

  const allAnswered = q.blanks.every(bl=> state[bl.label]!==undefined);
  let footer = '';
  if(!graded){
    footer = `<button class="btn primary block" id="btnGradeWb" ${allAnswered?'':'disabled'}>採点する</button>`;
  } else {
    const allCorrect = q.blanks.every(bl=> state[bl.label]===bl.answer);
    footer = renderVerdictAndExplain(allCorrect, q.explanation);
  }
  return `<div id="wbWrap">${blanksHtml}</div>${footer}`;
}

function renderVerdictAndExplain(correct, explanation){
  return `
    <div class="verdict-banner ${correct?'good':'bad'}">
      <span class="icon">${correct?'◯':'×'}</span>
      <span>${correct? '正解です！' : '不正解です'}</span>
    </div>
    <div class="explain-box">
      <div class="lbl">解説</div>
      <div class="body">${escapeHtml(explanation)}</div>
    </div>
    <button class="btn primary block" style="margin-top:16px;" id="btnNextQ">
      ${quizSession.idx+1 >= quizSession.pool.length? '結果を見る' : '次の問題へ'}
    </button>
  `;
}

function attachQuizPlayHandlers(){
  if(quizSession.idx >= quizSession.pool.length){ attachSummaryHandlers(); return; }
  const q = currentQ();

  if(q.type==='mc4'){
    document.querySelectorAll('.choice').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(quizSession.userState.answered!==undefined) return;
        const idx = parseInt(btn.dataset.idx);
        quizSession.userState.answered = idx;
        const correct = idx===q.correctIndex;
        recordResult(q.id, correct);
        quizSession.sessionTotal++; if(correct) quizSession.sessionCorrect++;
        render();
      });
    });
  }
  if(q.type==='ox'){
    quizSession.userState.ox = quizSession.userState.ox || {};
    document.querySelectorAll('.ox-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(quizSession.userState.oxGraded) return;
        const label = btn.dataset.label;
        quizSession.userState.ox[label] = btn.dataset.val==='true';
        render();
      });
    });
    const gradeBtn = document.getElementById('btnGradeOx');
    if(gradeBtn) gradeBtn.addEventListener('click', ()=>{
      quizSession.userState.oxGraded = true;
      const allCorrect = q.items.every(it=> quizSession.userState.ox[it.label]===it.correct);
      recordResult(q.id, allCorrect);
      quizSession.sessionTotal++; if(allCorrect) quizSession.sessionCorrect++;
      render();
    });
  }
  if(q.type==='calc'){
    const revealBtn = document.getElementById('btnReveal');
    if(revealBtn) revealBtn.addEventListener('click', ()=>{
      quizSession.userState.revealed = true; render();
    });
    const scBtn = document.getElementById('btnSelfCorrect');
    const swBtn = document.getElementById('btnSelfWrong');
    if(scBtn) scBtn.addEventListener('click', ()=>{
      quizSession.userState.selfGrade = true;
      recordResult(q.id, true);
      quizSession.sessionTotal++; quizSession.sessionCorrect++;
      render();
    });
    if(swBtn) swBtn.addEventListener('click', ()=>{
      quizSession.userState.selfGrade = false;
      recordResult(q.id, false);
      quizSession.sessionTotal++;
      render();
    });
  }
  if(q.type==='wordbank'){
    quizSession.userState.wb = quizSession.userState.wb || {};
    document.querySelectorAll('.wb-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(quizSession.userState.wbGraded) return;
        const label = btn.dataset.label;
        quizSession.userState.wb[label] = btn.dataset.num;
        render();
      });
    });
    const gradeWbBtn = document.getElementById('btnGradeWb');
    if(gradeWbBtn) gradeWbBtn.addEventListener('click', ()=>{
      quizSession.userState.wbGraded = true;
      const allCorrect = q.blanks.every(bl=> quizSession.userState.wb[bl.label]===bl.answer);
      recordResult(q.id, allCorrect);
      quizSession.sessionTotal++; if(allCorrect) quizSession.sessionCorrect++;
      render();
    });
  }
  const nextBtn = document.getElementById('btnNextQ');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    quizSession.idx++;
    quizSession.userState = {};
    render();
  });
}

function renderQuizSummary(){
  const pct = quizSession.sessionTotal? Math.round(quizSession.sessionCorrect/quizSession.sessionTotal*100):0;
  return `
    <div class="card" style="text-align:center;padding:32px 18px;">
      <div style="font-size:13px;color:var(--text-muted);font-weight:700;letter-spacing:.06em;">お疲れさまでした</div>
      <div style="font-family:var(--font-mono);font-size:44px;font-weight:700;color:var(--accent-strong);margin:10px 0;">${pct}%</div>
      <p style="margin:0;">${quizSession.sessionCorrect} / ${quizSession.sessionTotal} 問正解</p>
    </div>
    <div class="row" style="gap:10px;margin-top:16px;">
      <button class="btn block" id="btnBackHome">ホームへ</button>
      <button class="btn primary block" id="btnRetrySame">もう一度この範囲</button>
    </div>
  `;
}
function attachSummaryHandlers(){
  const home = document.getElementById('btnBackHome');
  if(home) home.addEventListener('click', ()=> setTab('home'));
  const retry = document.getElementById('btnRetrySame');
  if(retry) retry.addEventListener('click', ()=>{
    const pool = shuffle(quizSession.pool);
    startQuiz(pool);
  });
}

/* =========================================================
   REVIEW (missed questions)
   ========================================================= */
function renderReview(){
  const progress = loadProgress();
  const missed = ALL_QUESTIONS.filter(q=>{
    const rec = progress[q.id];
    return rec && rec.last===false;
  }).sort((a,b)=> (progress[b.id].ts||0) - (progress[a.id].ts||0));

  if(!missed.length){
    return `<h1>復習</h1><div class="empty"><div class="ic">🌱</div><p>まだ間違えた問題はありません。<br>演習をすすめると、ここに苦手な問題が集まります。</p></div>`;
  }

  const rows = missed.map(q=>{
    const meta = CATEGORIES[q.category];
    return `<div class="list-row" data-id="${q.id}">
      <span class="cat-chip ${meta.cls}">${meta.short}</span>
      <div class="txt">
        <div class="t1">${escapeHtml(q.question).slice(0,60)}${q.question.length>60?'…':''}</div>
        <div class="t2">${EXAM_META[q.examId].label} 問${q.number}</div>
      </div>
      <span style="color:var(--text-muted);">›</span>
    </div>`;
  }).join('');

  return `
    <h1>復習（間違えた問題）</h1>
    <p>${missed.length}問あります。タップすると解説を見られます。</p>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn primary block" id="btnReviewAll">この${missed.length}問をまとめて演習する</button>
    </div>
    <div class="card">${rows}</div>
  `;
}

function attachReviewHandlers(){
  const btn = document.getElementById('btnReviewAll');
  if(btn) btn.addEventListener('click', ()=>{
    const progress = loadProgress();
    const missed = ALL_QUESTIONS.filter(q=>{
      const rec = progress[q.id];
      return rec && rec.last===false;
    });
    startQuiz(shuffle(missed));
  });
  document.querySelectorAll('.list-row').forEach(row=>{
    row.addEventListener('click', ()=> openReviewModal(row.dataset.id));
  });
}

function openReviewModal(id){
  const q = Q_BY_ID[id];
  if(!q) return;
  const meta = CATEGORIES[q.category];
  let bodyHtml = '';
  if(q.type==='mc4'){
    bodyHtml = q.choices.map((c,i)=> `<div class="choice ${i===q.correctIndex?'correct':''}" style="cursor:default;">
      <span class="num">${i+1}</span><span>${escapeHtml(c)}</span>
    </div>`).join('');
  } else if(q.type==='ox'){
    bodyHtml = q.items.map(it=> `<div class="ox-item ${it.correct?'g-correct':'g-wrong'}">
      <div class="ox-text"><span class="ox-result-icon" style="color:${it.correct?'var(--good)':'var(--bad)'}">${it.correct?'◯':'×'}</span>（${it.label}）${escapeHtml(it.text)}</div>
    </div>`).join('');
  } else if(q.type==='calc'){
    bodyHtml = `<div class="card" style="background:var(--surface-2);border:none;">` +
      q.blanks.map(b=> `<div class="answer-blank">${b.label?`<span class="lab">（${b.label}）</span>`:''}<span class="val">${escapeHtml(b.answer)}</span></div>`).join('') +
      `</div>`;
  } else if(q.type==='wordbank'){
    bodyHtml = q.blanks.map(bl=>{
      const item = q.bank.find(b=> b.num===bl.answer);
      return `<div class="wb-blank g-correct">
        <div class="wb-blank-label">（${bl.label}）</div>
        <div class="wb-opts"><span class="wb-opt" data-active="true">${bl.answer}. ${escapeHtml(item? item.text:'')}</span></div>
      </div>`;
    }).join('');
  }
  const modal = document.createElement('div');
  modal.className='modal-backdrop';
  modal.innerHTML = `<div class="modal-sheet">
    <div class="q-meta"><span class="cat-chip ${meta.cls}">${meta.name}</span><span class="exam-tag">${EXAM_META[q.examId].label} 問${q.number}</span></div>
    <div class="q-text">${escapeHtml(q.question)}</div>
    ${bodyHtml}
    <div class="explain-box" style="margin-top:14px;"><div class="lbl">解説</div><div class="body">${escapeHtml(q.explanation)}</div></div>
    <button class="btn block" style="margin-top:16px;" id="btnCloseModal">閉じる</button>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.remove(); });
  document.getElementById('btnCloseModal').addEventListener('click', ()=> modal.remove());
}

      <h2>学習データ</h2>
      <p>全${os.total}問中 ${os.attempted}問に着手 ・ 累計${os.a}回解答</p>
      <button class="btn block" id="btnReset" style="border-color:var(--bad);color:var(--bad);">学習履歴をリセットする</button>
    </div>
    <div class="card">
      <h2>このアプリについて</h2>
      <p style="margin:0;">2級FP技能検定（学科試験・実技試験「資産設計提案業務」）の過去問題集です。日本ファイナンシャル・プランナーズ協会が公表した2024年5月分・2024年9月分・2025年1月分・2025年5月分（CBT公表問題）・2026年5月分（CBT公表問題）の計5回分の試験問題および模範解答をもとに作成しています。四答択一・○×判定・計算問題・語群選択の4形式に対応しています。</p>

}
function attachSettingsHandlers(){
  const btn = document.getElementById('btnReset');
  if(btn) btn.addEventListener('click', ()=>{
    openConfirmModal('学習履歴をすべて削除します。よろしいですか？', ()=>{
      localStorage.removeItem(LS_PROGRESS);
      localStorage.removeItem(LS_LOG);
      render();
      updateStreakDisplay();
    });
  });
}

function openConfirmModal(message, onConfirm){
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `<div class="modal-sheet" style="text-align:center;">
    <p style="margin:0 0 20px;">${escapeHtml(message)}</p>
    <div class="row" style="gap:10px;">
      <button class="btn block" id="btnConfirmCancel">キャンセル</button>
      <button class="btn block" id="btnConfirmOk" style="border-color:var(--bad);color:var(--bad);">削除する</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.remove(); });
  document.getElementById('btnConfirmCancel').addEventListener('click', ()=> modal.remove());
  document.getElementById('btnConfirmOk').addEventListener('click', ()=>{
    modal.remove();
    onConfirm();
  });
}

/* =========================================================
   lock screen
   ========================================================= */
const LS_UNLOCK = "fp2_unlock_v1";
const PASSPHRASE = "sanohayato";
function isUnlocked(){
  try{ return localStorage.getItem(LS_UNLOCK) === "1"; }catch(e){ return false; }
}
function initLock(){
  const overlay = document.getElementById('lockOverlay');
  if(!overlay) return;
  if(isUnlocked()){ overlay.remove(); return; }
  const form = document.getElementById('lockForm');
  const input = document.getElementById('lockInput');
  const err = document.getElementById('lockError');
  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    if(input.value.trim().toLowerCase() === PASSPHRASE.toLowerCase()){
      try{ localStorage.setItem(LS_UNLOCK, "1"); }catch(e){}
      overlay.remove();
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  });
}

/* =========================================================
   init
   ========================================================= */
document.querySelector('[data-tab="home"]').dataset.active = "true";
updateStreakDisplay();
render();
initLock();
</script>
